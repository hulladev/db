[package]
name = "hulladb_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Compatibility HTTP and SSE transport entry point for hulladb"
keywords = ["database", "postgresql", "reactive"]
categories = ["database"]

[features]
http = ["dep:hulladb", "hulladb/http"]

[dependencies]
hulladb = { version = "0.1.1", path = "../hulladb", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
hyper = { version = "1", features = ["client", "http1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v7"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
hyper-util = { version = "0.1", features = ["service"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }

[lints]
workspace = true
