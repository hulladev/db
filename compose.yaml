# Local development only. Credentials are intentionally public development values.
name: reactive-db-dev

services:
  postgres:
    image: postgres:18.6-bookworm
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=256MB"]
    environment:
      POSTGRES_USER: db_dev
      POSTGRES_PASSWORD: db_dev
      POSTGRES_DB: db_dev
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+ images store versioned data beneath this directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
