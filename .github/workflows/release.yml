name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Select release mode
        id: mode
        run: node scripts/release.mjs mode

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Open or update release PR
        uses: changesets/action/version@v2.1.2
        with:
          script: bun run version:packages
          commit-message: ":package: release: version packages"
          pr-title: ":package: release: version packages"
          github-token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

  native:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build macOS release assets
        if: matrix.platform == 'darwin-arm64'
        run: |
          bun run --cwd packages/db build:native
          bun run --cwd packages/db build:postgres
          bun run --cwd packages/db build:development
      - name: Build Linux assets on the supported Debian 12 baseline
        if: matrix.platform == 'linux-x64'
        run: |
          docker build --platform linux/amd64 -f packages/db/Dockerfile.native --output type=local,dest=/tmp/hulladb-native .
          bun run --cwd packages/db build:native --from /tmp/hulladb-native/native --platform linux-x64
          bun run --cwd packages/db build:development --from /tmp/hulladb-native/native --platform linux-x64
      - name: Archive native assets preserving executable modes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tar -czf "$RUNNER_TEMP/native-$PLATFORM.tgz" -C packages/db "native/$PLATFORM" development
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-${{ matrix.platform }}.tgz
          retention-days: 7

  pack:
    needs: [select, native]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: .release/native
          merge-multiple: true
      - name: Stage both supported native platforms
        run: |
          for archive in .release/native/*.tgz; do
            tar -xzf "$archive" -C packages/db
          done
          chmod +x packages/db/native/*/hulladb-*
          cargo build -p hulladb_js --locked
      - name: Check release sources and consumers
        run: bun run release:check:npm
        env:
          TURBO_CONCURRENCY: "2"
          HUSKY: "0"
      - name: Pack reviewed release plan
        run: bun run release:pack
      - uses: actions/upload-artifact@v6
        with:
          name: npm-release
          path: |
            .release/*.tgz
            .release/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pin npm with trusted publishing support
        run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: npm-release
          path: .release
      - name: Publish artifacts with npm OIDC
        run: node scripts/release.mjs publish
      - name: Verify fresh registry consumers
        run: node scripts/release.mjs verify

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: npm-release
          path: .release
      - name: Tag verified npm sources without an announcement
        run: node scripts/release.mjs tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish one GitHub Release for the complete family
        if: vars.PUBLISH_GITHUB_RELEASES == 'true'
        run: node scripts/release.mjs announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_GITHUB_RELEASES: ${{ vars.PUBLISH_GITHUB_RELEASES }}
