name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      postgres-tag: ${{ steps.postgres.outputs.tag }}
      postgres-published: ${{ steps.postgres.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Select release mode
        id: mode
        run: node scripts/release.mjs mode
      - name: Check for the managed PostgreSQL build
        id: postgres
        if: steps.mode.outputs.mode == 'publish'
        run: |
          tag="$(node -p 'const {version, revision} = require("./packages/db/scripts/postgres-build.json"); `postgresql-${version}-r${revision}`')"
          status="$(curl --location --silent --show-error --retry 3 --max-time 30 --output /dev/null --write-out '%{http_code}' \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/local-postgres-assets.json")"
          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *) echo "PostgreSQL manifest lookup returned HTTP $status" >&2; exit 1 ;;
          esac
          printf 'tag=%s\npublished=%s\n' "$tag" "$published" >> "$GITHUB_OUTPUT"

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Open or update release PR
        uses: changesets/action/version@v2.1.2
        with:
          script: bun run version:packages
          commit-message: ":package: release: version packages"
          pr-title: ":package: release: version packages"
          github-token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

  native:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build macOS release assets
        if: matrix.platform == 'darwin-arm64'
        run: bun run --cwd packages/db build:native
      - name: Build a new managed PostgreSQL archive on macOS
        if: matrix.platform == 'darwin-arm64' && needs.select.outputs.postgres-published == 'false'
        run: bun run --cwd packages/db build:postgres
      - name: Build Linux assets on the supported Debian 12 baseline
        if: matrix.platform == 'linux-x64'
        env:
          DOCKER_TARGET: ${{ needs.select.outputs.postgres-published == 'true' && 'runtime' || 'artifacts' }}
        run: |
          docker build --platform linux/amd64 -f packages/db/Dockerfile.native --target "$DOCKER_TARGET" --output type=local,dest=/tmp/hulladb-native .
          bun run --cwd packages/db build:native --from /tmp/hulladb-native/native --platform linux-x64
          if test "$DOCKER_TARGET" = artifacts; then
            mkdir -p packages/db-cli/native/linux-x64
            cp -a /tmp/hulladb-native/local-postgres/. packages/db-cli/native/linux-x64/
          fi
      - name: Verify installed development on macOS
        if: matrix.platform == 'darwin-arm64'
        env:
          HULLADB_REUSE_POSTGRES_ASSETS: ${{ needs.select.outputs.postgres-published }}
        run: |
          bun run --cwd packages/db build
          bun run --cwd packages/db-cli build
          bun run --cwd packages/db-postgres build
          bun packages/db/tests/development.integration.ts
      - name: Archive native assets preserving executable modes
        env:
          PLATFORM: ${{ matrix.platform }}
          POSTGRES_PUBLISHED: ${{ needs.select.outputs.postgres-published }}
        run: |
          paths=("packages/db-postgres/native/$PLATFORM")
          if test "$POSTGRES_PUBLISHED" = false; then paths+=("packages/db-cli/native/$PLATFORM"); fi
          tar -czf "$RUNNER_TEMP/native-$PLATFORM.tgz" "${paths[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-${{ matrix.platform }}.tgz
          retention-days: 7

  pack:
    needs: [select, native]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: .release/native
          merge-multiple: true
      - name: Stage both supported native platforms
        run: |
          for archive in .release/native/*.tgz; do
            tar -xzf "$archive"
          done
          chmod +x packages/db-postgres/native/*/hulladb-*
          cargo build -p hulladb_js --locked
      - name: Check release sources and consumers
        run: bun run release:check:npm
        env:
          TURBO_CONCURRENCY: "2"
          HUSKY: "0"
          HULLADB_REUSE_POSTGRES_ASSETS: ${{ needs.select.outputs.postgres-published }}
      - name: Pack reviewed release plan
        run: bun run release:pack
      - name: Stage the PostgreSQL downloads pinned by the CLI
        run: |
          version="$(node -p 'require("./.release/manifest.json").version')"
          cp "output/releases/$version"/hulladb-postgres-*.tar.gz "output/releases/$version/local-postgres-assets.json" .release/
      - uses: actions/upload-artifact@v6
        with:
          name: npm-release
          path: |
            .release/*.tgz
            .release/hulladb-postgres-*.tar.gz
            .release/local-postgres-assets.json
            .release/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-postgres:
    needs: [select, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-release
          path: .release
      - name: Publish and verify managed PostgreSQL downloads
        env:
          GH_TOKEN: ${{ github.token }}
          POSTGRES_TAG: ${{ needs.select.outputs.postgres-tag }}
          POSTGRES_PUBLISHED: ${{ needs.select.outputs.postgres-published }}
        run: |
          archives=(.release/hulladb-postgres-darwin-arm64.tar.gz .release/hulladb-postgres-linux-x64.tar.gz .release/local-postgres-assets.json)
          if test "$POSTGRES_PUBLISHED" = false; then
            if ! gh release view "$POSTGRES_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$POSTGRES_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Managed PostgreSQL build $POSTGRES_TAG" --notes "Used by hulla-db dev on first use." --draft --prerelease
            fi
            if test "$(gh release view "$POSTGRES_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true; then
              test "$(gh release view "$POSTGRES_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
              gh release upload "$POSTGRES_TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$POSTGRES_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$POSTGRES_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          fi
          for archive in "${archives[@]}"; do
            name="${archive##*/}"
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 90 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$POSTGRES_TAG/$name" -o "$RUNNER_TEMP/$name"
            cmp "$archive" "$RUNNER_TEMP/$name"
          done

  publish:
    needs: [pack, publish-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pin npm with trusted publishing support
        run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: npm-release
          path: .release
      - name: Publish artifacts with npm OIDC
        run: node scripts/release.mjs publish
      - name: Verify fresh registry consumers
        run: node scripts/release.mjs verify

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: npm-release
          path: .release
      - name: Tag verified npm sources without an announcement
        run: node scripts/release.mjs tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish one GitHub Release for the complete family
        if: vars.PUBLISH_GITHUB_RELEASES == 'true'
        run: node scripts/release.mjs announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_GITHUB_RELEASES: ${{ vars.PUBLISH_GITHUB_RELEASES }}
